{
  "schema": "ai-workflow-definition/v3",
  "id": "software-architect-pipeline",
  "version": "1.0.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "expert"
  ],
  "outputWorker": "expert",
  "gateDefinitions": {
    "report-complete": {
      "type": "output-schema"
    },
    "work-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_expert_work.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:expert-work-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:expert-work-check.json"
    }
  },
  "stages": [
    {
      "id": "INTAKE",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:INTAKE",
      "outputs": "schemas/intake.schema.json"
    },
    {
      "id": "WORK",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "INTAKE"
      ],
      "promptRef": "workflow.md#stage:WORK",
      "outputs": "schemas/work.schema.json",
      "onFail": "repair",
      "maxIterations": 2,
      "repairPromptRef": "workflow.md#stage:repair",
      "gates": [
        "work-integrity"
      ]
    },
    {
      "id": "REPORT",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "WORK"
      ],
      "promptRef": "workflow.md#stage:REPORT",
      "outputs": "schemas/report.schema.json",
      "gates": [
        "report-complete"
      ]
    }
  ],
  "defaultScenario": "standard",
  "requiredStages": [
    "INTAKE",
    "WORK",
    "REPORT"
  ],
  "scenarios": {
    "standard": {
      "summary": "本域默认常见任务；始终包含本域核心",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-01@1.0.0"
      ]
    },
    "task-01": {
      "summary": "需求到模块",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-01@1.0.0"
      ]
    },
    "task-02": {
      "summary": "接口边界",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-02@1.0.0"
      ]
    },
    "task-03": {
      "summary": "领域模型",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-03@1.0.0"
      ]
    },
    "task-04": {
      "summary": "架构取舍",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-04@1.0.0"
      ]
    },
    "task-05": {
      "summary": "ADR",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-05@1.0.0"
      ]
    },
    "task-06": {
      "summary": "迁移设计",
      "skills": [
        "domain-core-software-architect@1.0.0",
        "software-architect-task-06@1.0.0"
      ]
    }
  }
}
