{
  "schema": "ai-workflow-definition/v2",
  "id": "game-launch",
  "version": "2.1.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "builder"
  ],
  "outputWorker": "builder",
  "gateDefinitions": {
    "launch-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_game_launch.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:game-launch-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:game-launch-check.json"
    }
  },
  "stages": [
    {
      "id": "EXECUTE",
      "action": "prompt",
      "worker": "builder",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:EXECUTE",
      "inputs": "schemas/input.schema.json",
      "outputs": "schemas/execute.schema.json",
      "gates": [
        "launch-integrity"
      ],
      "onFail": "repair",
      "maxIterations": 2,
      "repairPromptRef": "workflow.md#stage:repair"
    },
    {
      "id": "SELFCHECK",
      "action": "prompt",
      "worker": "builder",
      "dependsOn": [
        "EXECUTE"
      ],
      "promptRef": "workflow.md#stage:SELFCHECK",
      "outputs": "schemas/selfcheck.schema.json"
    }
  ]
}
