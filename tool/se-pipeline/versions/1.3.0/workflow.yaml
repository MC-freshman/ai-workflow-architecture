{
  "schema": "ai-workflow-definition/v3",
  "id": "se-pipeline",
  "version": "1.3.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "expert"
  ],
  "outputWorker": "expert",
  "gateDefinitions": {
    "report-complete": {
      "type": "output-schema"
    },
    "work-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_expert_work.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:expert-work-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:expert-work-check.json"
    }
  },
  "stages": [
    {
      "id": "INTAKE",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:INTAKE",
      "outputs": "schemas/intake.schema.json"
    },
    {
      "id": "WORK",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "INTAKE"
      ],
      "promptRef": "workflow.md#stage:WORK",
      "outputs": "schemas/work.schema.json",
      "onFail": "repair",
      "maxIterations": 2,
      "repairPromptRef": "workflow.md#stage:repair",
      "gates": [
        "work-integrity"
      ]
    },
    {
      "id": "REPORT",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "WORK"
      ],
      "promptRef": "workflow.md#stage:REPORT",
      "outputs": "schemas/report.schema.json",
      "gates": [
        "report-complete"
      ]
    }
  ],
  "defaultScenario": "standard",
  "requiredStages": [
    "INTAKE",
    "WORK",
    "REPORT"
  ],
  "scenarios": {
    "standard": {
      "summary": "本域默认常见任务；始终包含本域核心",
      "skills": [
        "domain-core-software-engineer@1.1.0",
        "software-engineer-task-01@1.0.0",
        "software-product-experience@1.0.0"
      ]
    },
    "task-01": {
      "summary": "后端/API",
      "skills": [
        "domain-core-software-engineer@1.1.0",
        "software-engineer-task-01@1.0.0",
        "software-product-experience@1.0.0"
      ]
    },
    "task-02": {
      "summary": "通用编码",
      "skills": [
