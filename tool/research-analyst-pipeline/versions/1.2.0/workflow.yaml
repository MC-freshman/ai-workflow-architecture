{
  "schema": "ai-workflow-definition/v3",
  "id": "research-analyst-pipeline",
  "version": "1.2.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "expert"
  ],
  "outputWorker": "expert",
  "gateDefinitions": {
    "report-complete": {
      "type": "output-schema"
    },
    "work-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_expert_work.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:expert-work-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:expert-work-check.json"
    }
  },
  "stages": [
    {
      "id": "INTAKE",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:INTAKE",
      "outputs": "schemas/intake.schema.json"
    },
    {
      "id": "WORK",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "INTAKE"
      ],
      "promptRef": "workflow.md#stage:WORK",
      "outputs": "schemas/work.schema.json",
      "onFail": "repair",
      "maxIterations": 2,
      "repairPromptRef": "workflow.md#stage:repair",
      "gates": [
        "work-integrity"
      ]
    },
    {
      "id": "AUDIT",
      "action": "script",
      "worker": "none",
      "dependsOn": [
        "WORK"
      ],
      "script": "scripts/audit_deliverables.py",
      "outputs": "schemas/audit.schema.json"
    },
    {
      "id": "REPORT",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "WORK"
      ],
      "promptRef": "workflow.md#stage:REPORT",
      "outputs": "schemas/report.schema.json",
      "gates": [
        "report-complete"
      ]
    }
  ],
  "defaultScenario": "standard",
  "requiredStages": [
    "INTAKE",
    "WORK",
    "AUDIT",
    "REPORT"
  ],
  "scenarios": {
    "standard": {
      "summary": "本域默认常见任务；始终包含本域核心",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-01@1.0.0"
      ]
    },
    "task-01": {
      "summary": "检索策略",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-01@1.0.0"
      ]
    },
    "task-02": {
      "summary": "多源调查",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-02@1.0.0"
      ]
    },
    "task-03": {
      "summary": "来源核验",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-03@1.0.0"
      ]
    },
    "task-04": {
      "summary": "比较",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-04@1.0.0"
      ]
    },
    "task-05": {
      "summary": "证据综述",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-05@1.0.0"
      ]
    },
    "task-06": {
      "summary": "研究简报",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-analyst-task-06@1.0.0"
      ]
    },
    "paper-reader": {
      "summary": "单篇论文精读与中英对照讲解",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-paper-reader@1.0.0"
      ]
    },
    "paper-analysis": {
      "summary": "单篇论文 01–16 节深度分析与证据链审计",
      "skills": [
        "domain-core-research-analyst@1.0.0",
        "research-paper-card@1.0.0"
      ]
    }
  }
}
