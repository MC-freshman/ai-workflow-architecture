{
  "schema": "ai-workflow-definition/v3",
  "id": "document-engineer-pipeline",
  "version": "1.0.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "expert"
  ],
  "outputWorker": "expert",
  "gateDefinitions": {
    "report-complete": {
      "type": "output-schema"
    },
    "work-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_expert_work.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:expert-work-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:expert-work-check.json"
    }
  },
  "stages": [
    {
      "id": "INTAKE",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:INTAKE",
      "outputs": "schemas/intake.schema.json"
    },
    {
      "id": "WORK",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "INTAKE"
      ],
      "promptRef": "workflow.md#stage:WORK",
      "outputs": "schemas/work.schema.json",
      "onFail": "repair",
      "maxIterations": 2,
      "repairPromptRef": "workflow.md#stage:repair",
      "gates": [
        "work-integrity"
      ]
    },
    {
      "id": "REPORT",
      "action": "prompt",
      "worker": "expert",
      "dependsOn": [
        "WORK"
      ],
      "promptRef": "workflow.md#stage:REPORT",
      "outputs": "schemas/report.schema.json",
      "gates": [
        "report-complete"
      ]
    }
  ],
  "defaultScenario": "standard",
  "requiredStages": [
    "INTAKE",
    "WORK",
    "REPORT"
  ],
  "scenarios": {
    "standard": {
      "summary": "本域默认常见任务；始终包含本域核心",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-01@1.0.0"
      ]
    },
    "task-01": {
      "summary": "DOCX/PDF 创建编辑",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-01@1.0.0"
      ]
    },
    "task-02": {
      "summary": "样式结构",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-02@1.0.0"
      ]
    },
    "task-03": {
      "summary": "表格公式对象",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-03@1.0.0"
      ]
    },
    "task-04": {
      "summary": "转换",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-04@1.0.0"
      ]
    },
    "task-05": {
      "summary": "批处理",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-05@1.0.0"
      ]
    },
    "task-06": {
      "summary": "渲染核对",
      "skills": [
        "domain-core-document-engineer@1.0.0",
        "document-engineer-task-06@1.0.0"
      ]
    }
  }
}
