{
  "schema": "ai-workflow-definition/v3",
  "id": "game-pipeline",
  "version": "1.1.0",
  "mode": "pipeline",
  "maxParallel": 1,
  "roles": [
    "builder",
    "reviewer"
  ],
  "outputWorker": "builder",
  "stages": [
    {
      "id": "EXECUTE",
      "action": "prompt",
      "worker": "builder",
      "dependsOn": [],
      "promptRef": "workflow.md#stage:EXECUTE",
      "repairPromptRef": "workflow.md#stage:EXECUTE-REPAIR",
      "onFail": "repair",
      "maxIterations": 3,
      "outputs": "schemas/execute.schema.json",
      "gates": []
    },
    {
      "id": "SELFCHECK",
      "action": "prompt",
      "worker": "builder",
      "dependsOn": [
        "EXECUTE"
      ],
      "promptRef": "workflow.md#stage:SELFCHECK",
      "onFail": "stop",
      "outputs": "schemas/selfcheck.schema.json",
      "gates": []
    }
  ],
  "requiredStages": [
    "EXECUTE"
  ],
  "defaultScenario": "standard",
  "gateDefinitions": {
    "brainstorm-integrity": {
      "type": "process",
      "cwd": "evidence",
      "argv": [
        "workflow:scripts/validate_game_brainstorm.py"
      ],
      "expectExit": [
        0
      ],
      "expectArtifacts": [
        {
          "target": "evidence:game-brainstorm-check.json",
          "minBytes": 2
        }
      ],
      "reasonFrom": "evidence:game-brainstorm-check.json"
    },
    "gdd-integrity": {
